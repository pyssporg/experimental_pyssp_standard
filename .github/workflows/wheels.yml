# Build the distributable wheel, verify it carries every runtime XSD schema,
# upload it as a workflow artifact, and attach it to the release on a tag push.
# For more information see https://docs.github.com/actions

name: Wheels

on:
  push:
    branches: [ "main", "alpha", "architecture_review" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
    - name: Build wheel
      run: |
        python -m pip wheel --no-deps -w dist .
    - name: Verify the wheel carries every schema
      run: |
        # The wheel is the installed artifact, so missing XSDs are a runtime failure.
        src_count=$(find src -name '*.xsd' | wc -l)
        whl_count=$(unzip -l dist/*.whl | grep -c '\.xsd$' || true)
        echo "source XSDs: $src_count, wheel XSDs: $whl_count"
        test "$src_count" -gt 0
        test "$src_count" -eq "$whl_count"
    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: wheel
        path: dist/*.whl
        if-no-files-found: error
    - name: Attach wheel to release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # A tag push may not have a release yet; create it before attaching.
        gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
          || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
        gh release upload "${GITHUB_REF_NAME}" dist/*.whl --clobber
