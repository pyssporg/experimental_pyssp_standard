# pb.toml — product-breakdown layout for pyssp_standard.
#
# Only overrides of the built-in defaults live here; everything else is
# documented in the product-breakdown skill's templates/pb.toml.

[layout]
# Cold-storage decision archive, relative to this breakdown root.
archive = "../archive/archive.zip"
# Record `artifacts:` resolve from the repository root.
repo_root = "../.."

[registers]
# Generated registers live next to the archive, not in the tree.
index = "README.md"
log = "design-choice-log.md"
traceability = "traceability-map.md"

[ids]
# Handles cited from live leaves that have no filed node yet (backlog entries
# and implicit legacy decisions). They resolve as known ids without a path.
reserved_ids = [
  # Implicit product/architecture decisions catalogued by the retired decision log.
  "PD-001", "PD-002",
  "AD-001", "AD-002", "AD-003", "AD-004",
  "VD-001",
  # Behavioural requirements carried by the traceability matrix.
  "REQ-001", "REQ-002", "REQ-003", "REQ-004", "REQ-005",
  "REQ-006", "REQ-007", "REQ-008", "REQ-009", "REQ-010",
  "REQ-011", "REQ-012", "REQ-013", "REQ-014", "REQ-015",
  # Constraints.
  "CON-001", "CON-005", "CON-008", "CON-013", "CON-014", "CON-015",
  # Proposed improvements that stayed in the backlog, without a leaf.
  "IMP-014", "IMP-015", "IMP-016", "IMP-017", "IMP-018",
  # Delivered improvement whose dated rationale lives in record IMD-002.
  "IMP-030",
]
