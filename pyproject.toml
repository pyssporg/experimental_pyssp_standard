[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyssp-standard"
version = "0.9.2.dev0"
description = "Simple python package for reading, modifying and creating files, specified in the SSP Standard"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Fredrik Haider" },
]
keywords = ["SSP", "system", "engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "lxml",
]

[project.optional-dependencies]
dev = [
    "build",
    "myst-parser",
    "pytest>=7",
    "sphinx",
    "sphinx-rtd-theme",
]

[project.urls]
Homepage = "https://github.com/pyssporg/experimental_pyssp_standard"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "pyssp_standard",
    "pyssp_standard.facades*",
    "pyssp_standard.contracts*",
    "pyssp_standard.common*",
    "pyssp_standard.standard*",
    "pyssp_standard.tools*",
]

[tool.setuptools.package-data]
pyssp_standard = ["schema/**/*.xsd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = "3rdParty 3rd_party"
markers = [
    "codec: XML codec and parse/serialize layer tests",
    "facade: public facade and document editing workflow tests",
    "archive: archive and orchestration layer tests",
    "tooling: tooling and version-routing tests",
    "level_static: static surface, schema and public-export checks",
    "level_unit: single-module behaviour (validators, operations, runtime helpers)",
    "level_component: codec and facade behaviour over real documents",
    "level_contract: pinned public API contracts",
    "level_integration: several components cooperating",
    "level_system: end-to-end archive orchestration workflows",
    "level_acceptance: reproducibility and compliance acceptance evidence",
    "slow: tests that are intentionally excluded from the default run",
]
