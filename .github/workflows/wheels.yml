name: wheels

on:
  push:
    branches: [alpha]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"

      - name: Build wheel and sdist
        run: python -m build --wheel --sdist

      - name: Check artifacts
        # The wheel is the installed artifact, so missing XSDs are a runtime
        # failure: every source XSD must be inside the wheel.
        run: |
          python - <<'PY'
          import pathlib
          import zipfile

          dist = pathlib.Path("dist")
          wheels = sorted(dist.glob("*.whl"))
          sdists = sorted(dist.glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists
          assert not any("0.0.0" in path.name for path in dist.iterdir()), list(dist.iterdir())

          wheel = wheels[0]
          version = wheel.name.split("-", 1)[1].split("-")[0]
          sdist_version = sdists[0].name.removesuffix(".tar.gz").split("-", 1)[1]
          assert version != "0.0.0", wheel.name
          assert sdist_version == version, sdists[0].name

          with zipfile.ZipFile(wheel) as zf:
              assert zf.testzip() is None
              metadata = next(
                  name for name in zf.namelist()
                  if name.endswith(".dist-info/METADATA")
              )
              text = zf.read(metadata).decode()
              wheel_xsds = [name for name in zf.namelist() if name.endswith(".xsd")]

          assert "Name: experimental-pyssp-standard" in text, text
          assert f"Version: {version}" in text, text
          print(wheel.name)

          src_xsds = sorted(
              str(path.relative_to("src"))
              for path in pathlib.Path("src").rglob("*.xsd")
          )
          assert src_xsds, "no XSDs under src/"
          assert sorted(wheel_xsds) == [f"pyssp_standard/{p}" for p in src_xsds], (
              src_xsds, wheel_xsds
          )
          print(f"wheel carries {len(wheel_xsds)} XSDs matching src/")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
